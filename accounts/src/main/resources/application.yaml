server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: accounts
  h2:
    console:
      enabled: true
  datasource:
    url: "jdbc:h2:mem:testdb"
    username: sa
    password: ""
    driverClassName: "org.h2.Driver"
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: "org.hibernate.dialect.H2Dialect"






